{% extends 'partials/base.html' %} {% load static %} {% block extra_css %}
<link href="{% static 'libs/@fullcalendar/core/main.min.css' %}" rel="stylesheet" type="text/css" />
<link href="{% static 'libs/@fullcalendar/daygrid/main.min.css' %}" rel="stylesheet" type="text/css" />
<link href="{% static 'libs/@fullcalendar/bootstrap/main.min.css' %}" rel="stylesheet" type="text/css" />
{% endblock %} {% block contents %}
<div class="row">
    <div class="col-12">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div id="calendar"></div>
                    </div>
                </div>
            </div>
            <!-- end col -->
        </div>

        <div style="clear: both"></div>

        <!-- Add New Event MODAL -->
        <div class="modal fade" id="event-modal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header py-3 px-4 border-bottom-0">
                        <h5 class="modal-title" id="modal-title">Event</h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-hidden="true"></button>
                    </div>
                    <div class="modal-body p-4">
                        <form class="needs-validation" name="event-form" id="form-event" novalidate>
                            <div class="row">
                                <div class="col-12">
                                    <div class="mb-3">
                                        <label class="form-label">Event Name</label>
                                        <input class="form-control" placeholder="Insert Event Name" type="text" name="title" id="event-title" required value="" />
                                        <div class="invalid-feedback">Please provide a valid event name</div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="mb-3">
                                        <label class="form-label">Category</label>
                                        <select class="form-control form-select" name="category" id="event-category">
                                            <option selected>--Select--</option>
                                            <option value="bg-danger">Danger</option>
                                            <option value="bg-success">Success</option>
                                            <option value="bg-primary">Primary</option>
                                            <option value="bg-info">Info</option>
                                            <option value="bg-dark">Dark</option>
                                            <option value="bg-warning">Warning</option>
                                        </select>
                                        <div class="invalid-feedback">Please select a valid event category</div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-2">
                                <div class="col-6">
                                    <button type="button" class="btn btn-danger" id="btn-delete-event">Delete</button>
                                </div>
                                <div class="col-6 text-end">
                                    <button type="button" class="btn btn-light me-1" data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-success" id="btn-save-event">Save</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- end modal-content-->
            </div>
            <!-- end modal dialog-->
        </div>
        <!-- end modal-->
    </div>
</div>
{% endblock %} {% block extra_javascript %}
<!-- plugin js -->
<script src="{% static 'libs/moment/min/moment.min.js' %}"></script>
<script src="{% static 'libs/jquery-ui-dist/jquery-ui.min.js' %}"></script>
<script src="{% static 'libs/@fullcalendar/core/main.min.js' %}"></script>
<script src="{% static 'libs/@fullcalendar/bootstrap/main.min.js' %}"></script>
<script src="{% static 'libs/@fullcalendar/daygrid/main.min.js' %}"></script>

<!-- Calendar init -->
<script>
    var tasks = [{% for task in tasks %} { title: "{{task.task_name}}", start: new Date("{{task.date_created|date:'d M Y'}}"), display: "background" }, {% endfor %}]

    !(function (v) {
        "use strict"
        function e() {}
        ;(e.prototype.init = function () {
            var a = v("#event-modal"),
                t = v("#modal-title"),
                n = v("#form-event"),
                e = new Date(),
                s = e.getDate(),
                d = e.getMonth(),
                e = e.getFullYear()

            ;(e = tasks),
                document.getElementById("external-events"),
                (d = document.getElementById("calendar"))
            var c = new FullCalendar.Calendar(d, {
                displayEventTime: false,
                plugins: ["bootstrap", "dayGrid"],
                editable: !0,
                droppable: !0,
                selectable: !0,
                defaultView: "dayGridMonth",
                themeSystem: "bootstrap",
                events: e,
            })
            c.render()
        }),
            (v.CalendarPage = new e()),
            (v.CalendarPage.Constructor = e)
    })(window.jQuery),
        (function () {
            "use strict"
            window.jQuery.CalendarPage.init()
        })()
</script>
{% endblock %}
